<script>
/* AW_MUSIC_INJECT — composer artifact ".company/artifacts/splash-music.js" gets
   inlined here verbatim when delivered. It must expose
   window.AW_MUSIC = { start(ctx?, dest?), stop(fadeSec?), setMuted(bool) }.
   Until then the guarded AW_MUSIC calls in toggleSound()/begin() no-op safely. */
/* AW_MUSIC — AI Wars 3D splash opening theme: "BREACH PROTOCOL".
   DOOM-DOS-opening vibe, ORIGINAL composition (no existing melody quoted):
   E-minor blues scale (E G A Bb B D), 168 BPM, gallop triangle chug bass,
   ascending stab riff (inverse contour of the classic pedal-descent figure),
   4-on-floor kick + backbeat snare + off-8th hats, Em arp shimmer.
   Anti-fatigue: 4-pass variation cycle — pass0 core, pass1 +arp,
   pass2 riff up an octave, pass3 breakdown (riff drops out bars 1-4).
   Chris-Wilson lookahead scheduler (25ms interval, 0.12s ahead), self-heals
   after background-tab throttling; bus fades to silence while hidden.
   Contract: window.AW_MUSIC = { start(ctx?, dest?), stop(fadeSec?),
   setMuted(bool) } — idempotent, click-free, never throws. */
(function (g) {
  'use strict';
  if (g.AW_MUSIC) return; // double-load guard: first definition wins

  var noop = function () {};
  var AC = g.AudioContext || g.webkitAudioContext;
  if (typeof AC !== 'function') {
    // bare Node / no WebAudio: full no-op surface, same shape
    g.AW_MUSIC = { start: noop, stop: noop, setMuted: noop };
    return;
  }

  // ---- transport ----------------------------------------------------------
  var BPM = 168;
  var STEP = 60 / BPM / 4;        // 16th-note grid
  var PASS_STEPS = 128;           // 8 bars of 16ths per pass
  var LOOKAHEAD_MS = 25;
  var AHEAD = 0.12;               // schedule horizon (s)
  var BUS_GAIN = 0.9;             // into splash master(0.22) -> lp(6800)

  // ---- state ---------------------------------------------------------------
  var ctx = null, dest = null, bus = null, noiseBuf = null;
  var ownCtx = false;             // we created ctx (no args given to start)
  var timer = null, running = false, mutedF = false;
  var step = 0, nextTime = 0;

  // ---- note table (Hz) -----------------------------------------------------
  var E1 = 41.20, E2 = 82.41, G2 = 98.00, A2 = 110.00, Bb2 = 116.54;
  var D3 = 146.83, E3 = 164.81, G3 = 196.00, A3 = 220.00, Bb3 = 233.08, B3 = 246.94;
  var E4 = 329.63, G4 = 392.00, B4 = 493.88, E5 = 659.26;

    [E2, E2, E2, E2],
    [E2, E2, E2, E2],
    [E2, E2, G2, A2],
    [E2, E2, E2, E2],

  var P2 = [[0, E3, 0.11], [4, G3, 0.11], [8, A3, 0.11], [12, Bb3, 0.11],

  var P3 = [[0, E3, 0.11], [4, G3, 0.11], [8, A3, 0.11], [12, Bb3, 0.11],

      var dur = o.dur || 0.1;

        if (cents) osc.detune.value = cents;
        osc.frequency.setValueAtTime(o.freq, t0);
        if (o.freqEnd) osc.frequency.exponentialRampToValueAtTime(o.freqEnd, t0 + dur);
        osc.connect(into);
        osc.start(t0); osc.stop(end + 0.05);
        oscs.push(osc);

      var type = o.type || 'triangle';
      if (o.pair) { mk(type, 4, env); mk(type, -4, env); }
      else mk(type, 0, env);

        clp.type = 'lowpass'; clp.frequency.value = 2400;
        clp.connect(cg); cg.connect(env);
        mk('square', 0, clp);
      }

        var lfo = ctx.createOscillator();
        lfo.frequency.value = 5.5;
        var lg = ctx.createGain(); lg.gain.value = o.vib;

      var t0 = o.at;
      var dur = o.dur || 0.06;
      var end = t0 + Math.max(dur, 0.065);

  function snare(t, gn) { nz({ at: t, dur: 0.09, gain: gn, filter: 'bandpass', freq: 1100, q: 1 }); }
  function hat(t)       { nz({ at: t, dur: 0.03, gain: 0.016, filter: 'highpass', freq: 5500 }); }

  // ---- one 16th step of the pattern ----------------------------------------
  function scheduleStep(s, t, pass) {
    var bar = s >> 4, beat = (s >> 2) & 3, sub = s & 3;
    var v = pass & 3; // variation phase 0..3

    // BASS — gallop chug: accent 8th + two 16ths per beat, triangle pair.

    if (sub === 0)      tone({ type: 'triangle', freq: root, dur: 0.09, gain: 0.105, attack: 0.004, lpf: 1400, pair: 1, at: t });
    else if (sub >= 2)  tone({ type: 'triangle', freq: root, dur: 0.05, gain: 0.072, attack: 0.003, lpf: 1200, at: t });
    if (s % 16 === 0)   tone({ type: 'sine', freq: root / 2, dur: 0.30, gain: 0.05, attack: 0.01, lpf: 300, at: t }); // sub anchor

    // RIFF — drops out bars 1-4 on the breakdown pass; octave-up on pass 2.
    var rn = RIFF[s];
    if (rn && !(v === 3 && bar < 4)) {
      var f = rn[0], gn = 0.07;
      if (v === 2) { f *= 2; gn = 0.058; }
      tone({ type: 'triangle', freq: f, dur: rn[1], gain: gn, attack: 0.008, lpf: 2600, pair: 1, square: 1, vib: rn[2], at: t });
    }

    // ARP shimmer — passes >=1, bars 5-6 and 8 (skips bar 7's Bb rub).
    if (v >= 1 && (bar === 4 || bar === 5 || bar === 7)) {
      tone({ type: 'triangle', freq: ARP[s % 6], dur: 0.07, gain: 0.026, attack: 0.004, lpf: 3400, at: t });
    }

    // PERC — 4-on-floor kick, backbeat snare, off-8th hats; bar 4/8 fills.
    var fill = (bar === 3 || bar === 7) && beat === 3;
    if (fill) {
      if (pass % 2 === 0) snare(t, 0.028 + sub * 0.010);            // rising 16th build
      else { if (sub % 2 === 0) kick(t); else snare(t, 0.045); }    // kick-snare trade
    } else {
      if (sub === 0) { kick(t); if (beat === 1 || beat === 3) snare(t, 0.05); }
      if (sub === 2) hat(t);
    }
  }

  // ---- lookahead scheduler (Chris Wilson two-clocks pattern) ---------------
  function tick() {
    if (!ctx || !running) return;
    try {
      // self-heal after background-tab interval throttling: never replay
      // a backlog of missed steps, just re-anchor and continue the pattern.
      if (nextTime < ctx.currentTime - 0.02) nextTime = ctx.currentTime + 0.05;
      while (nextTime < ctx.currentTime + AHEAD) {
        scheduleStep(step % PASS_STEPS, nextTime, Math.floor(step / PASS_STEPS));
        nextTime += STEP;
        step++;
      }
    } catch (e) { /* no-op */ }
  }

  // ---- public surface -------------------------------------------------------
  function start(c, d) {
    if (running) return; // idempotent: second start is a no-op
    try {
      if (c) { ctx = c; dest = d || ctx.destination; ownCtx = false; }
      else {
        // standalone fallback: own ctx + master(0.5) -> lowpass 6.8k -> out
        if (!ctx || !ownCtx) {
          ctx = new AC();
          var lp = ctx.createBiquadFilter();
          lp.type = 'lowpass'; lp.frequency.value = 6800;
          lp.connect(ctx.destination);
          var m = ctx.createGain(); m.gain.value = 0.5; m.connect(lp);
          dest = m;
          ownCtx = true;
        }
      }
      if (ctx.state === 'suspended') { try { ctx.resume(); } catch (e) {} }
      if (!noiseBuf || noiseBuf.sampleRate !== ctx.sampleRate) {
        var len = Math.floor(ctx.sampleRate * 1);
        noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
        var dd = noiseBuf.getChannelData(0);
        for (var i = 0; i < len; i++) dd[i] = Math.random() * 2 - 1;
      }
      bus = ctx.createGain();
      bus.gain.value = mutedF ? 0.0001 : BUS_GAIN;
      bus.connect(dest);
      step = 0;
      nextTime = ctx.currentTime + 0.08;
      timer = setInterval(tick, LOOKAHEAD_MS);
      running = true;
    } catch (e) { running = false; }
  }

  function stop(fadeSec) {
    if (!running) return; // idempotent: stop without start / double stop
    running = false;
    if (timer != null) { clearInterval(timer); timer = null; }
    var b = bus; bus = null; // notes already scheduled ring into the fading bus
    var fs = (typeof fadeSec === 'number' && fadeSec > 0) ? fadeSec : 0.8;
    try {
      var t = ctx.currentTime;
      b.gain.cancelScheduledValues(t);
      b.gain.setTargetAtTime(0.0001, t, Math.max(0.05, fs / 3)); // fade, no click
    } catch (e) { /* no-op */ }
    setTimeout(function () {
      try { b.disconnect(); } catch (e) {}
      if (ownCtx && ctx) { try { ctx.suspend(); } catch (e) {} }
    }, (fs + 1.5) * 1000);
  }

  function setMuted(m) {
    mutedF = !!m; // remembered pre-start; scheduler keeps running when live
    if (bus && ctx) {
      try {
        var t = ctx.currentTime;
        bus.gain.cancelScheduledValues(t);
        bus.gain.setTargetAtTime(mutedF ? 0.0001 : BUS_GAIN, t, 0.03);
      } catch (e) { /* no-op */ }
    }
  }

  // Hidden tab: silence the bus (interval throttling would stutter anyway);
  // tick() re-anchors the grid on return, so the pattern resumes cleanly.
  if (g.document && typeof g.document.addEventListener === 'function') {
    try {
      g.document.addEventListener('visibilitychange', function () {
        if (!bus || !ctx) return;
        try {
          var t = ctx.currentTime;
          bus.gain.cancelScheduledValues(t);
          if (g.document.hidden) bus.gain.setTargetAtTime(0.0001, t, 0.05);
          else if (!mutedF)      bus.gain.setTargetAtTime(BUS_GAIN, t, 0.2);
        } catch (e) { /* no-op */ }
      });
    } catch (e) { /* no-op */ }
  }

/* AW_SONG — the splash theme (Gold_Medal_Sprint.mp3), routed through the splash
   master bus so it honours mute. Plain playback, no ducking. It is started
   ANCHORED to the logo slam (see the tick loop) with a currentTime offset so the
   song's 2.5s mark lands exactly on the AI WARS logo dropping in. */
(function (g) {
  'use strict';
  var SRC = './Gold_Medal_Sprint.mp3';
  var VOL = 1.0;                 /* song at full inside the master bus (master raised to 0.5) */
  var ctxR = null, el = null, node = null, gain = null, mutedF = false;
  function noop(){}
  if (typeof Audio === 'undefined') { g.AW_SONG = { start: noop, stop: noop, setMuted: noop }; return; }
  function ensure(ctx, dest){
    if (el) return;
    ctxR = ctx;
    el = new Audio(SRC); el.loop = true; el.preload = 'auto';
    try {
      node = ctx.createMediaElementSource(el);   /* once per element */
      gain = ctx.createGain(); gain.gain.value = mutedF ? 0.0001 : VOL;
      node.connect(gain); gain.connect(dest);    /* dest = splash master */
    } catch (e) { node = null; gain = null; }     /* fallback: element .volume */
  }
  /* start(ctx, dest, atSec): begin playback with currentTime = atSec, so the

  function start(ctx, dest, atSec){
    ensure(ctx, dest);
    if (!el) return;
    try { el.currentTime = Math.max(0, atSec || 0); } catch (e) {}
    try { var p = el.play(); if (p && p.catch) p.catch(function(){}); } catch (e) {}

  function setMuted(m){
    mutedF = !!m;
    if (gain && ctxR){ var t = ctxR.currentTime; gain.gain.cancelScheduledValues(t); gain.gain.setTargetAtTime(mutedF ? 0.0001 : VOL, t, 0.05); }
    else if (el){ el.volume = mutedF ? 0 : VOL; }
  }
  function stop(fadeSec){
    var f = fadeSec || 0.8;
    if (gain && ctxR){
      var t = ctxR.currentTime;
      gain.gain.cancelScheduledValues(t);
      gain.gain.setValueAtTime(Math.max(0.0001, gain.gain.value), t);
      gain.gain.linearRampToValueAtTime(0.0001, t + f);
    }
    var e2 = el;
    setTimeout(function(){ try { if (e2) e2.pause(); } catch (e) {} }, (f * 1000) + 140);

    this.promptOn = false; this.promptCycleT = 0; this.promptState = 0;
    this.beginning = false; this.beginT = -1;
    this.audio = null; this.muted = false;   /* sound ON by default; the actual audio
      unlocks at the first allowed moment (immediately if the browser permits, else the
      first user gesture) — browser autoplay policy forbids audio before any interaction */
    this.lastZap = 0; this.lastBling = -10;
    this._begun = false; this._lastToggleAt = -1000; this._songStarted = false;

    // ---- dark opening: grid forms from the void, stage lights up piece by piece ----
    this.ARC_ON = 7.15;
    this.RV = { w0: 1.6, w1: 5.0, base0: 4.5, base1: 5.9, lines1: 6.6, cx: 1150, cy: 693 };
    this.thunder = [2.2, 3.1];
    const LIT = [
      ['aw-defaultcore', 3.05], ['aw-debA', 3.3], ['aw-debB', 3.45], ['aw-flopA', 3.6], ['aw-debC', 3.75], ['aw-debD', 3.9],
      ['aw-burgA', 4.0], ['aw-debE', 4.15], ['aw-debF', 4.3], ['aw-debG', 4.45], ['aw-flopB', 4.55], ['aw-defcar', 4.65],
      ['aw-debH', 4.75], ['aw-burgB', 4.85], ['aw-burgC', 5.0], ['aw-flopC', 5.1], ['aw-burgD', 5.25], ['aw-burgE', 5.35],
      ['aw-flopD', 5.5], ['aw-burgF', 5.6], ['aw-attackcar', 5.7], ['aw-heroburger', 5.85], ['aw-ship', 5.95],
      ['aw-kidBR', 6.1], ['aw-kidTR', 6.25], ['aw-kidTL', 6.4], ['aw-kidBL', 6.55],
      ['aw-brainO', 6.7], ['aw-claw', 6.85], ['aw-brainB', 6.95]
    ];
    this.reveal = [];
    LIT.forEach((r, k) => {
      const el = document.getElementById(r[0]);
      if (el) this.reveal.push({ el, at: r[1], dur: 0.5, ph: k * 1.7, cleared: false });
    });
    this.revealDone = false; this.gridDone = false;
    this.spokenCard = null; this.voice = null;
    this.initVoices();

    if (this.reduced) {
      this.t0 -= this.SETTLE * 1000;
      this.finishCinematic();
    }

    // ---- events ----
    this.onResize = () => {
      const s = Math.min(innerWidth / 1920, innerHeight / 1080);
      this.baseScale = s;
      const pix = s >= 1 ? 'pixelated' : 'auto';
      document.querySelectorAll('#aw-stage img').forEach(im => { im.style.imageRendering = pix; });
    };
    this.onResize();
    addEventListener('resize', this.onResize);
    this.onKey = () => { this.gesture(); };
    this.onMove = (e) => {
      this.mouse.x = (e.clientX / innerWidth) * 2 - 1;
      this.mouse.y = (e.clientY / innerHeight) * 2 - 1;
    };
    this.onTap = (e) => {
      /* closest(): the button has SVG children — a hit anywhere inside it must
         toggle sound, never fall through to the begin/skip gate. skip/replay
         buttons are retired in game-integration; snd is the only button. */
      if (AW_SND_UI && e.target.closest && e.target.closest('#aw-sndbtn')) { this.toggleSound(); return; }
      this.gesture();
    };
    addEventListener('keydown', this.onKey);
    this.el.root.addEventListener('pointerdown', this.onTap);
    this.el.root.addEventListener('pointermove', this.onMove);

    /* cross-frame protocol: in walled (file://) mode the parent's top-right
       hotspot posts a toggle request; we always answer with the new state */
    // PACS0016 — handle every aiwars:* message ui.js posts here; a missing case silently no-ops — AGENTS.md
    this.onMsg = (e) => {
      const md = e && e.data;
      if (!md) return;
      /* case kept on purpose (PACS0016): the parent no longer posts sndtoggle
         while AW_SND_UI is false, but the contract stays wired for the restore. */
      if (md.type === 'aiwars:sndtoggle') { if (AW_SND_UI) this.toggleSound(); }
      /* parent posts this once the game console has landed: the iframe is kept
         alive (hidden) so the theme keeps playing, ducked to a bg level. */
      else if (md.type === 'aiwars:enterbg') this.enterBg();
    };
    addEventListener('message', this.onMsg);

    window.__awSeek = (s) => {
      const cur = (performance.now() - this.t0) / 1000;
      if (s < cur) this.replay();   /* rewind: full state reset, then jump */
      this.t0 = performance.now() - s * 1000;
    };
    /* sound ON by default: show the on-icon and try to start immediately — plays
       now if the browser allows autoplay, otherwise the first gesture unlocks it */
    this.ensureSoundOn();
    this.raf = requestAnimationFrame(this.tick.bind(this));
  }

  componentWillUnmount() {
    cancelAnimationFrame(this.raf);
    removeEventListener('resize', this.onResize);
    removeEventListener('keydown', this.onKey);
    removeEventListener('message', this.onMsg);
    if (this.el && this.el.root) {
      this.el.root.removeEventListener('pointerdown', this.onTap);
      this.el.root.removeEventListener('pointermove', this.onMove);
    }
    this.stopSpeech();
    try { if (window.AW_SONG) window.AW_SONG.stop(0.2); } catch (e) {}
    if (this.audio) { try { this.audio.ctx.close(); } catch (e) {} }
  }

  // rec: perspective compensation so element at depth z projects exactly onto its design position
  makeRec(el, z, cxOpt, cyOpt) {
    const P = this.PER;
    const cx = cxOpt != null ? cxOpt : el.offsetLeft + el.offsetWidth / 2;
    const cy = cyOpt != null ? cyOpt : el.offsetTop + el.offsetHeight / 2;
    const comp = (P - z) / P;
    return { el, z, comp, bx: (cx - this.VP.x) * (-z / P), by: (cy - this.VP.y) * (-z / P) };
  }

  T(rec, x, y, rot, sx, sy, dz) {
    rec.el.style.transform = 'translate3d(' + (rec.bx + (x || 0)) + 'px,' + (rec.by + (y || 0)) + 'px,' + (rec.z + (dz || 0)) + 'px) rotate(' + (rot || 0) + 'deg) scale(' + (rec.comp * (sx == null ? 1 : sx)) + ',' + (rec.comp * (sy == null ? sy = (sx == null ? 1 : sx) : sy)) + ')';
  }

  // ================== AUDIO ==================
  initAudio() {
    if (this.audio) return;
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const master = ctx.createGain(); master.gain.value = 0;
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 6800;
      master.connect(lp); lp.connect(ctx.destination);
      const humG = ctx.createGain(); humG.gain.value = 0.02;
      const humLP = ctx.createBiquadFilter(); humLP.type = 'lowpass'; humLP.frequency.value = 320;
      humG.connect(humLP); humLP.connect(master);
      const mk = (f, g, type) => { const o = ctx.createOscillator(); o.type = type || 'sine'; o.frequency.value = f; const gg = ctx.createGain(); gg.gain.value = g; o.connect(gg); gg.connect(humG); o.start(); return o; };
      mk(54, 0.9); mk(54.4, 0.7); mk(108, 0.28, 'triangle');
      const lfo = ctx.createOscillator(); lfo.frequency.value = 0.06;
      const lfoG = ctx.createGain(); lfoG.gain.value = 0.009;
      lfo.connect(lfoG); lfoG.connect(humG.gain); lfo.start();
      const nb = ctx.createBuffer(1, ctx.sampleRate * 0.25, ctx.sampleRate);
      const d = nb.getChannelData(0);
      for (let j = 0; j < d.length; j++) d[j] = (Math.random() * 2 - 1) * (1 - j / d.length);
      this.audio = { ctx, master, noise: nb };
    } catch (e) { this.audio = null; }
  }

  toggleSound() {
    const nw = performance.now();
    if (nw - this._lastToggleAt < 120) return;   /* double-fire guard: click + message race */
    this._lastToggleAt = nw;
    this.initAudio();
    if (!this.audio) return;
    this.muted = !this.muted;
    if (this.audio.ctx.state === 'suspended') { try { this.audio.ctx.resume(); } catch (e) {} }
    const g = this.audio.master.gain;
    g.cancelScheduledValues(this.audio.ctx.currentTime);
    g.setTargetAtTime(this.muted ? 0 : 0.5, this.audio.ctx.currentTime, 0.25);
    this.syncSndIcon();
    if (this.muted) {
      this.stopSpeech();
      try { if (window.AW_SONG) window.AW_SONG.setMuted(true); } catch (e) {}
    } else {
      /* reopen the theme bus; the tick loop owns starting it (anchored to the
         logo), so re-unmute just un-gates whatever is already playing */
      try { if (window.AW_SONG) window.AW_SONG.setMuted(false); } catch (e) {}
      if (!this.skipped && !this._begun) {
        const tc = (performance.now() - this.t0) / 1000;
        const c = this.CARDS.find((cc) => tc >= cc.t0 && tc < cc.t1);
        if (c) { this.spokenCard = c; this.say(c.say || c.txt); }
      }
    }
    /* walled-mode contract: the parent hotspot needs the authoritative state back */
    try { parent.postMessage({ type: 'aiwars:sndstate', muted: this.muted }, '*'); } catch (e) {}
  }

  /* icon-state switch — style writes only, never rebuilds DOM */
  syncSndIcon() {
    if (!this.el || !this.el.sndicon || !this.el.sndwaves || !this.el.sndstrike) return;
    const on = !this.muted;
    this.el.sndwaves.style.display = on ? '' : 'none';
    this.el.sndstrike.style.display = on ? 'none' : '';
    this.el.sndicon.style.opacity = on ? '1' : '0.55';
    this.el.sndicon.style.filter = on ? 'drop-shadow(0 0 4px rgba(255,208,2,0.8))' : 'none';
    this.el.sndbtn.style.borderColor = on ? 'rgba(255,208,2,0.8)' : 'rgba(255,208,2,0.35)';
    this.el.sndbtn.style.boxShadow = on ? '0 0 12px rgba(255,208,2,0.3)' : 'none';
  }

  // ================== ROBOT NARRATOR (speechSynthesis) ==================
  initVoices() {
    if (!('speechSynthesis' in window)) return;
    const pick = () => {
      const vs = speechSynthesis.getVoices();
      if (!vs || !vs.length) return;
      const rank = (v) => /zarvox|trinoids|albert/i.test(v.name) ? 0
        : /google us english/i.test(v.name) ? 1
        : /google uk english male/i.test(v.name) ? 2
        : /^en/i.test(v.lang) ? 3 : 4;
      this.voice = vs.slice().sort((a, b) => rank(a) - rank(b))[0];
    };
    pick();
    try { speechSynthesis.addEventListener('voiceschanged', pick); } catch (e) { try { speechSynthesis.onvoiceschanged = pick; } catch (e2) {} }
  }

  say(txt) {
    if (this.muted || !('speechSynthesis' in window)) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(txt);
      if (this.voice) u.voice = this.voice;
      u.pitch = 0.25; u.rate = 0.92; u.volume = 0.9;
      speechSynthesis.speak(u);
    } catch (e) {}
  }

  stopSpeech() { try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch (e) {} }

  zap(intens) {
    if (!this.audio || this.muted) return;
    const { ctx, master, noise } = this.audio;
    const now = ctx.currentTime;
    if (now - this.lastZap < 0.18) return;
    this.lastZap = now;
    const o = ctx.createOscillator(); o.type = 'triangle';
    o.frequency.setValueAtTime(620 + Math.random() * 420, now);
    o.frequency.exponentialRampToValueAtTime(130, now + 0.15);
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 2100;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.001, now);
    g.gain.exponentialRampToValueAtTime(0.11 * intens, now + 0.012);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.19);
    o.connect(f); f.connect(g); g.connect(master); o.start(now); o.stop(now + 0.22);
    const n = ctx.createBufferSource(); n.buffer = noise;
    const nf = ctx.createBiquadFilter(); nf.type = 'lowpass'; nf.frequency.value = 1600;
    const ng = ctx.createGain();
    ng.gain.setValueAtTime(0.045 * intens, now);
    ng.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
    n.connect(nf); nf.connect(ng); ng.connect(master); n.start(now); n.stop(now + 0.14);
  }

  whoosh() {
    if (!this.audio || this.muted) return;
    const { ctx, master, noise } = this.audio;
    const now = ctx.currentTime;
    const n = ctx.createBufferSource(); n.buffer = noise; n.loop = true;
    const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 0.8;
    f.frequency.setValueAtTime(240, now);
    f.frequency.exponentialRampToValueAtTime(900, now + 0.5);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.001, now);
    g.gain.exponentialRampToValueAtTime(0.05, now + 0.22);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
    n.connect(f); f.connect(g); g.connect(master); n.start(now); n.stop(now + 0.65);
  }

  thud(k) {
    k = k || 1;
    if (!this.audio || this.muted) return;
    const { ctx, master, noise } = this.audio;
    const now = ctx.currentTime;
    const o = ctx.createOscillator();
    o.frequency.setValueAtTime(130, now);
    o.frequency.exponentialRampToValueAtTime(38, now + 0.3);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.001, now);
    g.gain.exponentialRampToValueAtTime(0.2 * k, now + 0.015);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.42);
    o.connect(g); g.connect(master); o.start(now); o.stop(now + 0.45);
    const n = ctx.createBufferSource(); n.buffer = noise;
    const nf = ctx.createBiquadFilter(); nf.type = 'lowpass'; nf.frequency.value = 900;
    const ng = ctx.createGain();
    ng.gain.setValueAtTime(0.09 * k, now);
    ng.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
    n.connect(nf); nf.connect(ng); ng.connect(master); n.start(now); n.stop(now + 0.22);
  }

  blip() {
    if (!this.audio || this.muted) return;
    const { ctx, master } = this.audio;
    const now = ctx.currentTime;
    const o = ctx.createOscillator(); o.type = 'square'; o.frequency.value = 740 + Math.random() * 160;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.001, now);
    g.gain.exponentialRampToValueAtTime(0.025, now + 0.008);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
    o.connect(g); g.connect(master); o.start(now); o.stop(now + 0.07);
  }

  bling() {
    if (!this.audio || this.muted) return;
    const { ctx, master } = this.audio;
    const now = ctx.currentTime;
    if (now - this.lastBling < 4) return;
    this.lastBling = now;
    [523.25, 784, 1046.5].forEach((f, k) => {
      const o = ctx.createOscillator(); o.frequency.value = f;
      const g = ctx.createGain();
      const t = now + k * 0.07;
      g.gain.setValueAtTime(0.001, t);
      g.gain.exponentialRampToValueAtTime(0.03, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.34);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.4);
    });
  }

  beginChord() {
    if (!this.audio || this.muted) return;
    const { ctx, master } = this.audio;
    const now = ctx.currentTime;
    [220, 277.18, 330].forEach((f) => {
      const o = ctx.createOscillator(); o.frequency.value = f;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.001, now);
      g.gain.exponentialRampToValueAtTime(0.05, now + 0.05);
      g.gain.exponentialRampToValueAtTime(0.001, now + 1.3);
      o.connect(g); g.connect(master); o.start(now); o.stop(now + 1.4);
    });
  }

  // ================== FLOW ==================
  /* sound-on-by-default: raise the master bus at the first moment the browser
     allows it (immediately if autoplay is permitted, else the first gesture).
     The song itself is started by the tick loop, anchored to the logo slam. */
  ensureSoundOn() {
    this.initAudio();
    this.syncSndIcon();
    if (!this.audio || this.muted) return;
    const ctx = this.audio.ctx;
    const up = () => {
      if (!this.audio || this.muted || ctx.state !== 'running') return;
      const g = this.audio.master.gain;
      g.cancelScheduledValues(ctx.currentTime);
      g.setTargetAtTime(0.5, ctx.currentTime, 0.25);
    };
    if (ctx.state === 'suspended') { try { ctx.resume().then(up).catch(() => {}); } catch (e) {} }
    else up();
  }

  gesture() {
    this.ensureSoundOn();   /* first real gesture is when a cold load's audio unlocks */
    const t = (performance.now() - this.t0) / 1000;
    if (!this.skipped && !this.reduced && t < 9.6) { this.skip(); return; }
    if (this.promptOn && !this.beginning) this.begin();
  }

  finishCinematic() {
    this.skipped = true;
    this.el.boot.style.display = 'none';
    this.bootDone = true;
    this.el.card.style.opacity = '0';
    this.slamStarted = true; this.slamDone = true;
    this.logoZ = 230; this.logoV = 0;
    this.el.logowrap.style.opacity = '1';
    this.kick = 0; this.impactP = 0; this.impactAge = 9;
    this.forced = []; this.whooshes = [];
    const tNow = (performance.now() - this.t0) / 1000;
    this.drops.forEach((d) => { d.at = -10; d.hit1 = d.hit2 = true; });
    this.textsAt = { 'aw-txtShare': tNow - 1, 'aw-txtNoRef': tNow - 1, 'aw-txtFuture': tNow - 1 };
    this.promptAt = tNow + 0.4;
    this.cam = { wx: 0, wy: 0, wz: 0, rx: 0, ry: 0 };
    this.el.flashW.style.opacity = '0'; this.el.flashB.style.opacity = '0';
    this.revealDone = true; this.gridDone = true;
    this.el.space.style.opacity = '1';
    this.el.grid.style.opacity = '1';
    const s1 = this.el.gridlines.style, s2 = this.el.gridglow.style;
    s1.opacity = '0'; s2.opacity = '0';
    s1.maskImage = 'none'; s1.webkitMaskImage = 'none';
    s2.maskImage = 'none'; s2.webkitMaskImage = 'none';
    this.reveal.forEach((r) => { r.el.style.filter = ''; r.cleared = true; });
    this.stopSpeech();
  }

  skip() {
    this.t0 = performance.now() - (this.SETTLE + 0.55) * 1000;
    this.finishCinematic();
    this.nextSheen = this.SETTLE + 1.2;
  }

  replay() {
    this.initAudio();
    this.t0 = performance.now();
    this.skipped = false;
    this.bootDone = false;
    this.el.boot.style.display = 'flex';
    this.el.boot.style.opacity = '1';
    this.el.boot.textContent = '';
    this.el.card.style.opacity = '0';
    this.slamStarted = false; this.slamDone = false;
    this.logoZ = 900; this.logoV = 0;
    this.el.logowrap.style.opacity = '0';
    this.kick = 0; this.impactP = 0; this.impactAge = 9; this.shockT = -1;
    this.forced = [2.2, 3.1, 7.2];
    this.whooshes = [4.0, 6.3, 8.4];
    this.nextBurst = 4.2; this.nextSheen = Infinity; this.sheenT = -1;
    this.nextSpark = 6.6;
    this.revealDone = false; this.gridDone = false;
    this.el.space.style.opacity = '0';
    this.el.grid.style.opacity = '0';
    this.reveal.forEach((r) => { r.cleared = false; });
    this.spokenCard = null; this.stopSpeech();
    this.promptOn = false; this.promptState = 0; this.promptCycleT = 0;
    this.el.ctaswap.style.opacity = '0'; this.el.txtCTA.style.opacity = '0';
    this.drops[0].at = 9.15; this.drops[1].at = 9.45; this.drops[2].at = 9.75;
    this.drops.forEach((d) => { d.hit1 = d.hit2 = false; });
    this.textsAt = { 'aw-txtShare': 10.7, 'aw-txtNoRef': 10.9, 'aw-txtFuture': 11.1 };
    this.promptAt = 11.4;
    this.beginning = false; this.beginT = -1;
    this.el.flashB.style.opacity = '0';
    this.cam = { wx: this.KF[0].wx, wy: this.KF[0].wy, wz: this.KF[0].wz, rx: this.KF[0].rx, ry: this.KF[0].ry };
  }

  /* the console has landed: keep the theme alive but drop the whole splash bus
     to a background level (song stays dominant in the mix, ambient hum sinks
     under it) and freeze the now-hidden 3D scene. Audio rides the media element
     + AudioContext, both independent of the animation loop, so cancelling the
     rAF costs nothing but CPU. SONG_BG_MASTER (0.30) is the one knob to tune. */
  enterBg() {
    if (this._bg) return;
    this._bg = true;
    try {
      if (this.audio && this.audio.master) {
        const g = this.audio.master.gain, t = this.audio.ctx.currentTime;
        g.cancelScheduledValues(t);
        g.setValueAtTime(Math.max(0.0001, g.value), t);
        g.linearRampToValueAtTime(this.muted ? 0.0001 : 0.30, t + 1.1);  /* SONG_BG_MASTER */
      }
    } catch (e) {}
    try { cancelAnimationFrame(this.raf); } catch (e) {}
  }

  begin() {
    if (this._begun) return;                        /* idempotent: no double chord/flash */
    this._begun = true;
    this.beginning = true; this.beginT = 0;
    this.stopSpeech();                              /* narrator yields to the launch sting */
    /* the theme keeps playing through the launch; the parent ducks it to a bg
       level via aiwars:enterbg once the console lands (see enterBg). */
    this.beginChord();
    try { window.dispatchEvent(new CustomEvent('aiwars:splashbegin')); } catch (e) {}
  }

  camTarget(t) {
    const KF = this.KF;
    if (!this.skipped && t < KF[KF.length - 1].t) {
      let a = KF[0], b = KF[1];
      for (let i = 0; i < KF.length - 1; i++) { if (t >= KF[i].t) { a = KF[i]; b = KF[i + 1]; } }
      let q = Math.min(1, Math.max(0, (t - a.t) / (b.t - a.t)));
      q = q < 0.5 ? 4 * q * q * q : 1 - Math.pow(-2 * q + 2, 3) / 2;
      const L = (k) => a[k] + (b[k] - a[k]) * q;
      return { wx: L('wx'), wy: L('wy'), wz: L('wz'), rx: L('rx'), ry: L('ry') };
    }
    const par = (this.props.parallax ?? 1) * (this.reduced ? 0 : 1);
    const TAU = Math.PI * 2;
    return {
      wx: this.mouse.x * -12 * par + 6 * Math.sin(t * TAU * 0.026 + 4),
      wy: this.mouse.y * -9 * par + 5 * Math.sin(t * TAU * 0.033 + 1),
      wz: 16 * Math.sin(t * TAU * 0.02),
      rx: -this.mouse.y * 1.7 * par + 0.9 * Math.sin(t * TAU * 0.06 + 2),
      ry: this.mouse.x * 2.4 * par + 1.6 * Math.sin(t * TAU * 0.045)
    };
  }

  // fall-from-top with comic double bounce; before start: parked above frame, invisible
  dropCalc(dr, t) {
    const u = t - dr.at;
    if (u < 0) return { dy: -dr.H, sqx: 1, sqy: 1, vis: 0 };
    const d1 = 0.42, b1 = 0.36, b2 = 0.2;
    let dy = 0;
    if (u < d1) { const q = u / d1; dy = -dr.H * (1 - q * q); }
    else {
      if (!dr.hit1) { dr.hit1 = true; this.shake = Math.max(this.shake, 3.2); this.thud(0.55); }
      if (u < d1 + b1) { const v = (u - d1) / b1; dy = -dr.H * 0.14 * 4 * v * (1 - v); }
      else {
        if (!dr.hit2) { dr.hit2 = true; this.thud(0.22); }
        if (u < d1 + b1 + b2) { const v = (u - d1 - b1) / b2; dy = -dr.H * 0.035 * 4 * v * (1 - v); }
      }
    }
    const sq = (ti, mag) => { const w = u - ti; return w >= 0 ? mag * Math.exp(-w * 13) : 0; };
    const s = sq(d1, 0.15) + sq(d1 + b1, 0.06);
    return { dy, sqx: 1 + s * 0.9, sqy: 1 - s, vis: 1 };
  }

  // ================== MAIN LOOP ==================
  tick(now) {
    this.raf = requestAnimationFrame(this.tick.bind(this));
    const t = (now - this.t0) / 1000;
    const dt = Math.min(0.05, (now - (this.lastNow || now)) / 1000 || 0.016);
    this.lastNow = now;
    const P = {
      drift: this.props.explosionDrift ?? 1,
      arcAct: this.props.arcActivity ?? 1,
      hover: this.props.hoverEnergy ?? 1
    };
    const RM = this.reduced ? 0.35 : 1;
    const TAU = Math.PI * 2;
    const settleRaw = Math.min(1, t / this.SETTLE);
    const settle = 1 - Math.pow(1 - settleRaw, 3);
    const p = settle * P.drift;
    const T = this.T.bind(this);

    // ---- dark opening: shared reveal state ----
    let flashF = 0;
    if (!this.revealDone) {
      for (const fa of this.thunder) {
        const fu = t - fa;
        if (fu >= 0 && fu < 0.6) flashF = Math.max(flashF, Math.exp(-fu * 6.5) * (0.55 + 0.45 * Math.sin(fu * 90)));
      }
      if (t > this.ARC_ON + 0.45) {
        this.revealDone = true;
        this.reveal.forEach((r) => { if (!r.cleared) { r.el.style.filter = ''; r.cleared = true; } });
      }
    }
    const vis01 = (a, d) => this.revealDone ? 1 : Math.min(1, Math.max(0, (t - a) / d));
    const arcVis = vis01(this.ARC_ON, 0.3);
    const shipVis = vis01(5.95, 0.5);

    // ---- camera chase ----
    const tgt = this.camTarget(t);
    const ch = 1 - Math.pow(0.004, dt);
    for (const k of ['wx', 'wy', 'wz', 'rx', 'ry']) this.cam[k] += (tgt[k] - this.cam[k]) * ch;
    this.el.world.style.transform =
      'translate3d(' + this.cam.wx + 'px,' + this.cam.wy + 'px,' + this.cam.wz + 'px) rotateX(' + this.cam.rx + 'deg) rotateY(' + this.cam.ry + 'deg)';

    // ---- whoosh cues ----
    if (this.whooshes.length && t >= this.whooshes[0]) { this.whooshes.shift(); this.whoosh(); }

    // ---- stage: shake + breath + impact punch ----
    if (this.shake > 0.001) { this.shake *= Math.pow(0.0001, dt); this.shakeT += dt; } else this.shake = 0;
    const shx = this.shake * Math.sin(this.shakeT * 130) * RM;
    const shy = this.shake * Math.cos(this.shakeT * 111) * 0.7 * RM;
    this.impactP *= Math.pow(0.012, dt);
    const breath = 1 + 0.006 * Math.sin(t * TAU / 12);
    let punch = 0;
    if (this.beginning) {
      this.beginT += dt;
      const b = this.beginT;
      punch = b < 0.45 ? (b / 0.45) * (b / 0.45) * 0.06 : 0.06;
      this.el.flashW.style.opacity = b < 0.14 ? String(0.85 * (1 - b / 0.14)) : '0';
      this.el.flashB.style.opacity = b > 0.35 ? String(Math.min(1, (b - 0.35) / 0.5)) : '0';
      if (b > 1.5 && b < 2.6) this.el.flashB.style.opacity = String(Math.max(0, 1 - (b - 1.5) / 0.8));
      if (b >= 2.6) { this.beginning = false; this.el.flashB.style.opacity = '0'; }
    }
    this.el.stage.style.transform =
      'translate(-50%, -50%) scale(' + (this.baseScale * breath * (1 + punch + this.impactP)) + ') translate(' + shx + 'px,' + shy + 'px)';
    this.el.stage.style.filter = this.impactP > 0.002 ? 'saturate(' + (1 + this.impactP * 14) + ') brightness(' + (1 + this.impactP * 5) + ')' : 'none';

    // ---- boot overlay ----
    if (!this.bootDone) {
      const chars = Math.max(0, Math.floor((t - 0.12) * 95));
      let out = '', used = 0, done = true;
      for (let i = 0; i < this.BOOT.length; i++) {
        const line = this.BOOT[i];
        if (chars > used + line.length) { out += line + '\n'; used += line.length; }
        else { const sh = Math.max(0, chars - used); out += line.slice(0, sh); done = false; if (sh > 0 && sh < line.length && Math.random() < 0.25) this.blip(); break; }
      }
      this.el.boot.textContent = out + (t % 0.5 < 0.3 ? '\u2588' : '');
      if (t > 1.55) {
        this.el.boot.style.opacity = String(Math.max(0, 1 - (t - 1.55) / 0.3));
        if (t > 1.9) { this.el.boot.style.display = 'none'; this.bootDone = true; }
      }
    }

    // ---- story cards ----
    if (!this.skipped && t < 9.0) {
      let active = null;
      for (const c of this.CARDS) if (t >= c.t0 && t < c.t1) active = c;
      if (active) {
        if (this.spokenCard !== active && !this.muted) { this.spokenCard = active; this.say(active.say || active.txt); }
        const sh = Math.floor((t - active.t0) * 34);
        if (sh <= active.txt.length && Math.random() < 0.2) this.blip();
        this.el.card.textContent = active.txt.slice(0, sh);
        this.el.card.style.opacity = '1';
        this.el.card.style.color = active.big ? '#ff9a3d' : '#cfe7ff';
        this.el.card.style.transform = 'translateX(-50%) scale(' + (active.big ? 1.3 : 1) + ')';
      } else this.el.card.style.opacity = '0';
    }

    // ---- floaters ----
    this.kick *= Math.pow(0.05, dt);
    for (const it of this.items) {
      const c = it.c;
      const drift = c.amp * p * (0.7 + 0.6 * it.distK) + this.kick * 46 * it.distK;
      const wob = c.wob * P.hover * RM;
      const x = it.dx * drift + (Math.sin(t * TAU * c.wf + it.ph) + 0.55 * Math.sin(t * TAU * c.wf * 1.73 + it.ph * 2.6)) * wob;
      const y = it.dy * drift + (Math.cos(t * TAU * c.wf * 0.9 + it.ph * 1.7) + 0.6 * Math.cos(t * TAU * c.wf * 1.41 + it.ph * 3.1)) * wob * 1.35;
      let rot = 0;
      if (c.spin) rot = it.sgn * c.spin * t * 6 % 360;
      if (c.tumble) rot += it.sgn * (c.tumble * p + Math.sin(t * TAU * c.wf * 0.8 + it.ph) * c.tumble * 0.6);
      if (it.el === this.el.attackcar && !this.reduced) rot += 0.7 * Math.sin(t * TAU * 6.5);
      const s = 1 + c.sk * p + this.kick * 0.05;
      const dz = it.zb * Math.sin(t * TAU * c.wf * 0.62 + it.ph * 1.3) * P.hover * RM;
      let yy = y, sxx = s, syy = s;
      const dr = this.dropMap[it.el.id];
      if (dr) { const o = this.dropCalc(dr, t); yy += o.dy; sxx *= o.sqx; syy *= o.sqy; it.el.style.opacity = String(o.vis); }
      const tAt = this.textsAt[it.el.id];
      if (tAt != null) { const a = Math.min(1, Math.max(0, (t - tAt) / 0.4)); yy += (1 - a) * 26; it.el.style.opacity = String(a); }
      T(it.rec, x, yy, rot, sxx, syy, dz);
    }

    // ---- motes ----
    const moteVis = vis01(4.4, 1.4);
    for (const mo of this.motes) {
      const phase = ((t * mo.sp + mo.seed) % 700) / 700;
      const yOff = 350 - 700 * phase;
      const xOff = 26 * Math.sin(t * 0.35 + mo.seed);
      T(mo.rec, xOff, yOff, 0, 1, 1);
      mo.d.style.opacity = String((0.12 + 0.5 * Math.sin(phase * Math.PI)) * (0.75 + 0.25 * Math.sin(t * 2.1 + mo.seed)) * moteVis);
    }

    // ---- starfield twinkle + space static base ----
    T(this.rec['aw-space'], 0, 0, 0, 1, 1);
    T(this.rec['aw-starA'], 0, 0, 0, 1, 1);
    T(this.rec['aw-starB'], 0, 0, 0, 1, 1);
    const starVis = Math.max(vis01(1.2, 1.8), flashF * 0.6);
    this.el.starA.style.opacity = String((0.55 + 0.25 * Math.sin(t * 1.1)) * starVis);
    this.el.starB.style.opacity = String((0.6 + 0.3 * Math.sin(t * 0.8 + 2)) * starVis);
    if (!this.revealDone) this.el.space.style.opacity = String(Math.min(1, vis01(1.5, 2.6) + flashF * 0.4));

    // ---- grid breath + forming wave (luminance mask ∩ expanding radial) ----
    const gs = 1 + 0.014 * Math.sin(t * TAU / 9);
    T(this.rec['aw-gridwrap'], 0, 0, 0, gs, gs);
    if (!this.gridDone) {
      const RV = this.RV;
      const s1 = this.el.gridlines.style, s2 = this.el.gridglow.style;
      if (t < RV.w0) {
        s1.opacity = '0'; s2.opacity = '0';
        this.el.grid.style.opacity = '0';
      } else {
        const q0 = Math.min(1, (t - RV.w0) / (RV.w1 - RV.w0));
        const q = Math.pow(q0, 2.2);   /* ease-in: linger small near the vanishing point, then rush out */
        const R = 8 + q * 1430;
        const soft = 90 + 200 * q;
        const gu = "url('layers/BG_Grid.png')";
        const lm = gu + ', radial-gradient(circle at ' + RV.cx + 'px ' + RV.cy + 'px, #fff ' + Math.max(0, R - soft).toFixed(0) + 'px, rgba(255,255,255,0) ' + R.toFixed(0) + 'px)';
        const gm = gu + ', radial-gradient(circle at ' + RV.cx + 'px ' + RV.cy + 'px, rgba(255,255,255,0) ' + Math.max(0, R - 150).toFixed(0) + 'px, #fff ' + Math.max(0, R - 45).toFixed(0) + 'px, #fff ' + R.toFixed(0) + 'px, rgba(255,255,255,0) ' + (R + 70).toFixed(0) + 'px)';
        s1.maskImage = lm; s1.webkitMaskImage = lm;
        s2.maskImage = gm; s2.webkitMaskImage = gm;
        s1.filter = 'brightness(' + (1.35 + 0.85 * (1 - q)).toFixed(2) + ') saturate(1.2)';
        const linesOut = 1 - Math.min(1, Math.max(0, (t - RV.base1) / (RV.lines1 - RV.base1)));
        s1.opacity = String(Math.min(1, (t - RV.w0) / 0.35) * (0.78 + 0.1 * Math.sin(t * 43)) * linesOut);
        const ringOut = 1 - Math.min(1, Math.max(0, (t - RV.w1) / 0.7));
        s2.opacity = String(Math.min(1, (t - RV.w0) / 0.3) * ringOut * (0.8 + 0.2 * Math.sin(t * 31)));
        const baseA = Math.min(1, Math.max(0, (t - RV.base0) / (RV.base1 - RV.base0)));
        this.el.grid.style.opacity = String(baseA * baseA * (0.94 + 0.06 * Math.sin(t * 37)));
        if (t > RV.lines1) {
          this.gridDone = true;
          this.el.grid.style.opacity = '1';
          s1.opacity = '0'; s2.opacity = '0';
          s1.maskImage = 'none'; s1.webkitMaskImage = 'none';
          s2.maskImage = 'none'; s2.webkitMaskImage = 'none';
        }
      }
    }

    // ---- lightning arc ----
    if (t >= this.nextArcEv) {
      const r = Math.random();
      const m = this.arcMode;
      if (r < 0.62) { m.rot = (Math.random() - 0.5) * 10; m.s = 0.88 + Math.random() * 0.28; m.bright = 1.5 + Math.random() * 0.9; }
      else if (r < 0.9) { m.fx = Math.random() < 0.5 ? -1 : 1; m.fy = Math.random() < 0.72 ? 1 : -1; m.rot = (Math.random() - 0.5) * 14; m.s = 0.85 + Math.random() * 0.35; }
      else { m.s = 0.6; m.bright = 0.9; }
      this.nextArcEv = t + (0.03 + Math.random() * 0.1) / P.arcAct;
    }
    let burst = 0;
    let fire = false;
    if (this.forced.length && t >= this.forced[0]) { this.forced.shift(); fire = true; }
    if (t >= this.nextBurst && this.burstHold <= 0) {
      if (!this.revealDone && t < this.ARC_ON) { this.nextBurst = this.ARC_ON + 0.35; }
      else { fire = true; this.nextBurst = t + (1.6 + Math.random() * 2.6) / P.arcAct; }
    }
    if (fire && this.burstHold <= 0) { this.burstHold = 0.22; this.shake = Math.max(this.shake, 2.2); this.zap(1); }
    if (this.burstHold > 0) { this.burstHold -= dt; burst = Math.max(0, this.burstHold / 0.22); }
    const m = this.arcMode;
    const flick = 0.72 + Math.random() * 0.28;
    const bs = m.s * (1 + burst * 0.65);
    T(this.rec['aw-arc'], 0, 0, m.rot, m.fx * bs, m.fy * bs);
    this.el.arc.style.opacity = String(Math.min(1, flick + burst * 0.5) * arcVis);
    this.el.arc.style.filter = 'brightness(' + (m.bright + burst * 1.1) + ') saturate(0.55) hue-rotate(170deg)';
    T(this.rec['aw-arcglow'], 0, 0, m.rot, m.fx * bs, m.fy * bs);
    this.el.arcglow.style.opacity = String((0.35 + burst * 0.65) * arcVis);
    T(this.rec['aw-arcbg'], 0, 0, 0, 1, 1);
    this.el.arcbg.style.opacity = String((0.22 + 0.1 * Math.sin(t * TAU * 0.5) + burst * 0.55) * arcVis + (1 - arcVis) * 0.16 * flashF);

    // ---- brains ----
    this.burstGlow = Math.max(burst, this.burstGlow * Math.pow(0.02, dt));
    const g = this.burstGlow;
    if (burst > 0.9) { this.lunge = 1; this.recoil = 1; }
    this.lunge *= Math.pow(0.05, dt); this.recoil *= Math.pow(0.08, dt);
    const oy = Math.sin(t * TAU * 0.34) * 7 * P.hover;
    const orot = Math.sin(t * TAU * 0.34 + 0.8) * 1.6;
    T(this.rec['aw-brainO'], this.lunge * 10, oy, orot + this.lunge * 1.2, 1, 1);
    this.el.brainO.style.filter = g > 0.02 ? 'brightness(' + (1 + g * 0.28) + ')' : 'none';
    const jx = this.reduced ? 0 : (Math.random() - 0.5) * 2.4;
    const jy = this.reduced ? 0 : (Math.random() - 0.5) * 2;
    const by = Math.sin(t * TAU * 0.9 + 2) * 4.5 * P.hover;
    T(this.rec['aw-brainB'], this.recoil * -12 + jx, by + jy, Math.sin(t * TAU * 0.9) * 1 - this.recoil * 2, 1, 1);
    this.el.brainB.style.filter = g > 0.02 ? 'brightness(' + (1 + g * 0.35) + ')' : 'none';

    // ---- claw hinge ----
    if (burst > 0.9) this.clawV -= 90;
    this.clawTarget = -5 + Math.sin(t * TAU * 0.21) * 8;
    const kk = 26, damp = 5.2;
    this.clawV += (this.clawTarget - this.clawA) * kk * dt - this.clawV * damp * dt;
    this.clawA += this.clawV * dt;
    T(this.rec['aw-claw'], this.recoil * -9, by * 0.85, this.clawA, 1, 1);

    // ---- ship ----
    const sy = Math.sin(t * TAU * 0.23) * 17 * P.hover;
    const sx = Math.sin(t * TAU * 0.061) * 28 * P.hover;
    const srot = Math.sin(t * TAU * 0.23 + 0.6) * 2.6;
    T(this.rec['aw-shipwrap'], sx, sy, srot, 1, 1);
    if (!this.reduced) this.el.ship.style.filter = 'brightness(' + (1 + Math.random() * 0.1) + ')';
    this.el.shipglow.style.opacity = String((0.34 + 0.2 * Math.sin(t * TAU * 0.5) + Math.random() * 0.08) * shipVis);
    if (t >= this.nextSpark) {
      const which = Math.random() < 0.5 ? 0 : 1;
      this.sparkT[which] = 0.11;
      this.nextSpark = t + 0.9 + Math.random() * 1.9;
      if (Math.random() < 0.35) this.zap(0.5);
    }
    [this.el.spark0, this.el.spark1].forEach((sp, si) => {
      if (this.sparkT[si] > 0) {
        this.sparkT[si] -= dt;
        sp.style.opacity = String(Math.random() * 0.6 + 0.4);
        sp.style.transform = 'rotate(' + (Math.random() * 40 - 20) + 'deg) scale(' + (Math.random() < 0.5 ? -1 : 1) + ',1)';
      } else sp.style.opacity = '0';
    });

    // ---- attack core ----
    const beamPulse = 1 + 0.015 * Math.sin(t * TAU * 2.7) + (this.reduced ? 0 : Math.random() * 0.02);
    let coreGlitchX = 0, coreFilter = 'brightness(' + (1 + (this.reduced ? 0 : Math.random() * 0.07)) + ')';
    if (t >= this.nextGlitch) { this.glitchT = 0.13; this.nextGlitch = t + 2.2 + Math.random() * 2.8; }
    if (this.glitchT > 0) {
      this.glitchT -= dt;
      coreGlitchX = (Math.random() - 0.5) * 6;
      coreFilter = 'brightness(1.15) hue-rotate(' + (Math.random() * 40 - 20) + 'deg)';
    }
    const cy = Math.sin(t * TAU * 0.19 + 1.2) * 6 * P.hover;
    const acD = this.dropCalc(this.dropMap['aw-attackcore'], t);
    this.el.attackcore.style.opacity = String(acD.vis);
    T(this.rec['aw-attackcore'], coreGlitchX, cy + acD.dy, 0, beamPulse * acD.sqx, beamPulse * acD.sqy);
    this.el.attackcore.style.filter = coreFilter;

    // ---- worker smash ----
    this.smashPh = (this.smashPh + dt) % 1.9;
    const sp2 = this.smashPh;
    let wrot = 0;
    if (sp2 < 0.14) wrot = -2.2 * (sp2 / 0.14);
    else if (sp2 < 0.24) { wrot = -2.2 + 7.2 * ((sp2 - 0.14) / 0.1); }
    else if (sp2 < 0.6) { wrot = 5 * (1 - (sp2 - 0.24) / 0.36); }
    const wy = Math.sin(t * TAU * 0.31 + 4) * 5 * P.hover;
    const wD = this.dropCalc(this.dropMap['aw-worker'], t);
    this.el.worker.style.opacity = String(wD.vis);
    T(this.rec['aw-worker'], 0, wy + wD.dy, wrot, wD.sqx, wD.sqy);

    // ---- defense core error flicker (motion handled by items loop) ----
    if (t >= this.nextErrFlick) { this.errT = 0.16; this.nextErrFlick = t + 2.6 + Math.random() * 3; }
    if (this.errT > 0) { this.errT -= dt; this.el.defensecore.style.filter = 'brightness(' + (1.1 + Math.random() * 0.25) + ')'; }
    else this.el.defensecore.style.filter = 'none';

    // ---- SONG: start so its 2.5s mark lands on the logo slam (SLAM_T) ----
    // anchor = SLAM_T - 2.5; start with a matching currentTime offset so the hit
    // stays aligned even if the audio only unlocked partway through the intro.
    if (!this._songStarted && !this.muted && !this._begun && this.audio &&
        this.audio.ctx.state === 'running' && t >= this.SLAM_T - 2.5) {
      this._songStarted = true;
      try { if (window.AW_SONG) window.AW_SONG.start(this.audio.ctx, this.audio.master, t - (this.SLAM_T - 2.5)); } catch (e) {}
    }

    // ---- LOGO: slam from camera, then float + sheen ----
    if (!this.slamStarted && t >= this.SLAM_T && !this.skipped) { this.slamStarted = true; }
    if (this.slamStarted) {
      const lrec = this.rec['aw-logowrap'];
      if (!this.slamDone) {
        this.el.logowrap.style.opacity = '1';
        this.logoV += (230 - this.logoZ) * 60 * dt - this.logoV * 7.8 * dt;
        this.logoZ += this.logoV * dt;
        if (this.logoZ < 262 && this.logoV < 0) {
          this.slamDone = true;
          this.impactP = 0.032; this.impactAge = 0;
          this.shake = Math.max(this.shake, 7);
          this.kick = 1;
          this.shockT = 0;
          this.el.flashW.style.opacity = '0.55';
          this.thud(); this.zap(1.4);
          this.nextSheen = t + 0.6;
        }
      }
      this.impactAge += dt;
      if (this.slamDone && this.el.flashW.style.opacity !== '0' && !this.beginning) {
        this.el.flashW.style.opacity = String(Math.max(0, parseFloat(this.el.flashW.style.opacity) - dt * 5));
      }
      const q = this.impactAge < 1 ? 0.09 * Math.exp(-6 * this.impactAge) * Math.sin(18 * this.impactAge) : 0;
      const wob = this.slamDone ? 0 : Math.sin(t * 31) * 1.6;
      const ly = this.slamDone ? Math.sin(t * TAU * 0.08) * 3.5 : 0;
      const zNow = this.slamDone ? 230 + (this.logoZ - 230) * 0.3 : this.logoZ;
      this.el.logowrap.style.transform =
        'translate3d(' + lrec.bx + 'px,' + (lrec.by + ly) + 'px,' + zNow + 'px) rotate(' + wob + 'deg) scale(' + (lrec.comp * (1 + q)) + ',' + (lrec.comp * (1 - q)) + ')';
    }
    if (this.shockT >= 0) {
      this.shockT += dt;
      const sq = this.shockT / 0.55;
      if (sq >= 1) { this.shockT = -1; this.el.shock.style.opacity = '0'; }
      else {
        this.el.shock.style.opacity = String(0.9 * (1 - sq));
        this.el.shock.style.transform = 'scale(' + (0.3 + sq * 2.3) + ')';
      }
    }

    // ---- sheen ----
    if (t >= this.nextSheen && this.sheenT < 0) { this.sheenT = 0; this.bling(); }
    if (this.sheenT >= 0) {
      this.sheenT += dt;
      const q = this.sheenT / 1.5;
      if (q >= 1) { this.sheenT = -1; this.nextSheen = t + 3.6 + Math.random() * 1.4; this.el.sheen.style.backgroundPosition = '160% 0%'; }
      else {
        const e = q < 0.5 ? 2 * q * q : 1 - Math.pow(-2 * q + 2, 2) / 2;
        this.el.sheen.style.backgroundPosition = (160 - 320 * e) + '% 0%';
      }
    }
    // glow rides the sweep with a sine envelope: swells in, peaks mid-sweep,
    // dies out — never snaps (same fix as the 2D splash)
    if (this.sheenT >= 0) {
      const gq = Math.min(1, this.sheenT / 1.5);
      const glowA = Math.sin(gq * Math.PI);
      this.el.logo.style.filter = 'drop-shadow(0 0 ' + (6 + 10 * glowA).toFixed(1) + 'px rgba(140,220,255,' + (0.55 * glowA).toFixed(3) + '))';
    } else this.el.logo.style.filter = 'none';

    // ---- static-base texts ----
    const shA = Math.min(1, Math.max(0, (t - this.textsAt['aw-txtShare']) / 0.4));
    T(this.rec['aw-txtShare'], 0, (1 - shA) * 24, 0, 1, 1);
    T(this.rec['aw-txtCTA'], 0, 0, 0, 1, 1);
    T(this.rec['aw-ctaswap'], 0, 0, 0, 1, 1);
    this.el.txtShare.style.opacity = String(shA * (0.9 + 0.1 * Math.sin(t * TAU * 0.2)));
    if (!this.promptOn) this.el.txtCTA.style.opacity = '0';

    // ---- prompt cycle ----
    if (!this.promptOn && t > this.promptAt) { this.promptOn = true; this.promptCycleT = 0; this.promptState = 1; }
    if (this.promptOn) {
      this.promptCycleT += dt;
      const fadeIn = Math.min(1, this.promptCycleT / 0.6);
      if (this.promptState === 1) {
        this.el.ctaswap.style.opacity = String(fadeIn);
        this.el.txtCTA.style.opacity = String(1 - fadeIn);
        if (this.promptCycleT > 6.5) { this.promptState = 2; this.promptCycleT = 0; }
      } else {
        this.el.ctaswap.style.opacity = String(1 - fadeIn);
        this.el.txtCTA.style.opacity = String(fadeIn);
        if (this.promptCycleT > 3) { this.promptState = 1; this.promptCycleT = 0; }
      }
    }

    // ---- dark opening: silhouettes flicker alive piece by piece ----
    if (!this.revealDone) {
      for (const it of this.reveal) {
        const u = t - it.at;
        if (u < 0) {
          it.el.style.filter = 'brightness(' + (0.03 + 0.24 * flashF).toFixed(3) + ')';
        } else if (u < it.dur) {
          const fq = u / it.dur;
          const on = Math.sin(u * 57 + it.ph * 9) > (1 - 2.2 * fq);
          const b = on ? (1 + 0.45 * (1 - fq)) : (0.05 + 0.3 * fq);
          it.el.style.filter = 'brightness(' + b.toFixed(3) + ')';
          it.cleared = false;
        } else if (!it.cleared) { it.el.style.filter = ''; it.cleared = true; }
      }
    }

    // ---- corner buttons: skip/replay retired in game-integration (parent iframe
    //      owns skip/begin); the old _skipShown flip re-showed them here — gone.
    //      #aw-sndbtn was the last visible control, top-right — now retired too
    //      (hidden + gated on AW_SND_UI). The splash has no visible controls.
  }

  renderVals() { return {}; }
}

/* Prop defaults come straight from the data-props block the design tool used
   to emit; these are the same values the runtime passed in. */
new Component({ explosionDrift: 2, arcActivity: 3, hoverEnergy: 2, parallax: 2 }).componentDidMount();
</script>
</body>
</html>
